<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>All You Can Fly Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./src/ui/theme-bootstrap.js"></script>
  <!-- Tailwind CSS -->
  <script src="./assets/css/tailwind_cdn_409.js"></script>
  <script src="./assets/emojis/twemoji.min.js"></script>
  <script src="./assets/twemoji-init.js"></script>
  <script type="module" src="src/app/main.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-gray-50">
  <section class="pt-4">
    <div class="container mx-auto px-4">
      <div class="flex flex-col lg:flex-row gap-1">
        <div class="w-full lg:w-1/2 space-y-4">
          <!-- Changelog, Version and GitHub Links -->
          <div class="flex justify-between items-center p-2 bg-gray-100 rounded-md shadow-md mb-4">
          <!-- Changelog Button -->

          <div class="flex justify-center gap-2 items-center">
            <button id="changelog-button" class="inline-flex items-center gap-1 justify-center flex-nowrap min-w-0 whitespace-nowrap bg-[#20006D] text-white px-3 py-2 rounded-md font-bold shadow-md hover:bg-[#1A005D] active:bg-[#1A005D] transition cursor-pointer">
              📜 About
            </button>
            <a href="https://multipass.wizzair.com/w6/subscriptions/spa/private-page/wallets" 
              target="_blank" 
              rel="noopener noreferrer" 
              class="external-link inline-flex items-center gap-1 justify-center flex-nowrap min-w-0 whitespace-nowrap bg-[#C90076] text-white px-3 py-2 rounded-md font-bold shadow-md hover:bg-[#A00065] active:bg-[#A00050] transition cursor-pointer">
              AYCF website
            </a>
            <a href="https://github.com/deniam/AllYouCanFlyPro" 
              target="_blank" 
              rel="noopener noreferrer"
              class="external-link inline-flex items-center gap-1 justify-center flex-nowrap min-w-0 whitespace-nowrap text-white bg-gray-600 px-3 py-2 rounded-md font-bold shadow-md hover:bg-[#1A005D] hover:text-white active:bg-[#1A005D] transition cursor-pointer">
              ⭐ GitHub
            </a>
          </div>
        </div>

        <!-- Changelog Popup -->
        <div id="changelog-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
          <div class="bg-white rounded-lg shadow-xl w-full ml-4 mr-4 max-w-2xl max-h-[80vh] overflow-hidden">
            <div class="flex justify-between items-center bg-[#20006D] text-white p-4">
              <a id="donate-link-modal" href="https://buy.stripe.com/4gM00j9fA6Hua291mWbo400" target="_blank"
                rel="noopener noreferrer" class="donate-link bg-[#C90076] hover:bg-[#A00065] text-white font-bold py-2 px-4 rounded text-center transition">
                ☕ Support with donation
            </a>
              <br>
              <button id="close-changelog" class="text-white text-2xl cursor-pointer">&times;</button>
            </div>
            
            <div id="changelog-content" class="p-4 overflow-y-auto max-h-[60vh]"></div>
          </div>
        </div>

          <!-- Header / Logo -->
          <div class="text-center mt-[0px] mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 40 300 70" preserveAspectRatio="xMidYMid meet">
              <defs>
                <linearGradient id="lineGradient" gradientUnits="userSpaceOnUse" x1="20" y1="60" x2="280" y2="60">
                  <stop offset="0" stop-color="var(--theme-brand-text)" />
                  <stop offset="1" stop-color="#C90076" />
                </linearGradient>
              </defs>
              <rect width="300" height="120" fill="transparent"/>
              <g transform="translate(20,20)">
                <line x1="0" y1="40" x2="260" y2="40" stroke="url(#lineGradient)" stroke-width="4" stroke-linecap="round" />
                <circle cx="0" cy="40" r="6" fill="var(--theme-brand-text)" />
                <circle cx="260" cy="40" r="6" fill="#C90076" />
                <path d="M120 20 L140 40 L120 60 L125 40 Z" fill="var(--theme-brand-text)" />
              </g>
              <text x="50%" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--theme-brand-text)">
                All You Can Fly Pro ✈️ 😎
              </text>
            </svg>
          </div>
          <!-- Main block -->
          <div class="container mb-4 mx-auto px-0">
            <div class="relative bg-gray-100 rounded-lg shadow-md p-2 overflow-visible">
              <!-- Flight Search Form -->
              <div class="mb-2 flex items-center relative">
                <!-- Origin Multi -->
                <div class="flex-1">
                  <label for="origin-multi" class="sr-only">Origin</label>
                  <div id="origin-multi" class="multi-airport-container bg-gray-100 border border-gray-300 rounded-md pr-2">
                  </div>
                </div>
                <!-- Swap button -->
                <button id="swap-button" class="p-1.5 bg-[#20006D] text-white rounded-full hover:bg-[#A00065] flex items-center justify-center w-7 h-7 shadow-md transition cursor-pointer" title="Swap">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
                  </svg>
                </button>
                <!-- Destination Multi --> 
                <div class="flex-1">
                  <label for="destination-multi" class="sr-only">Destination</label>
                  <div id="destination-multi" class="multi-airport-container bg-gray-100 border border-gray-300 rounded-md pl-2">
                  </div>
                </div>
              </div>
              <!-- Calendars -->
                <div class="mb-2 flex gap-7 items-center">
                  <!-- Departure Date -->
                  <div class="flex-1 relative">
                    <input type="text" id="departure-date" readonly
                           class="block w-full bg-gray-100 border border-gray-300 text-gray-800 rounded-md px-1 py-2 focus:outline-none focus:ring-2 focus:ring-[#C90076] cursor-pointer"
                           placeholder="Select Departure Date">
                    <div id="departure-calendar-popup" class="calendar-popup hidden" style="width: 220px; font-size: 0.8rem;"></div>
                  </div>
                  <!-- Return Date -->
                  <div class="flex-1 relative" id="return-date-wrapper">
                    <div id="add-return-date-button-container" class="w-full">
                      <button id="trip-type-toggle" class="w-full flex items-center justify-center gap-1 px-1 py-2 text-[#20006D] font-medium rounded-md border border-[#20006D] focus:outline-none focus:ring-2 focus:ring-[#20006D] transition cursor-pointer bg-white hover:bg-[#20006D] hover:text-white active:bg-[#20006D] active:text-white">
                        <span id="trip-type-text">Add Return Date</span>
                      </button>
                    </div>
                    <div id="return-date-container" class="w-full" style="display: none;">
                      <div class="relative">
                        <input type="text" id="return-date" readonly
                               class="block w-full bg-gray-100 border border-gray-300 text-gray-800 rounded-md px-1 py-2 focus:outline-none focus:ring-2 focus:ring-[#C90076] cursor-pointer"
                               placeholder="Select Return Date">
                      <button id="remove-return-date"
                      class="absolute top-1/2 right-1 bg-[#20006D] text-white text-xs rounded-2xl hover:bg-[#A00065] flex items-center justify-center shadow-md transition cursor-pointer"
                      style="width:1.5rem; height:1.5rem; transform: translateY(-50%);">
                         ✕
                       </button>
                       
                      </div>
                      <div id="return-calendar-popup" class="calendar-popup hidden" style="width: 220px; font-size: 0.8rem;"></div>
                    </div>
                  </div>
                </div>
              <!-- Search button -->
              <div class="flex items-center justify-between">
                <button id="search-button" class="flex items-center gap-1 px-1 py-2 bg-[#C90076] text-white text-medium font-bold rounded-lg hover:bg-[#A00065] active:bg-[#A00050] transition cursor-pointer">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5 inline-block align-middle">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                  </svg>
                  SEARCH
                </button>
                <!-- Stopover button -->
                <div class="flex items-center gap-2">
                  <div class="relative ml-2">
                    <button id="stopover-dropdown-button" class="flex items-center px-1 py-2 bg-gray-200 text-gray-800 text-xs font-medium rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 transition cursor-pointer">
                      <span id="selected-stopover">Non-stop only</span>
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
                      </svg>
                    </button>
                    <!-- Stopover dropdown -->
                    <div id="stopover-dropdown" class="absolute left-0 mt-1 w-full bg-white border border-gray-300 rounded-lg shadow-lg hidden z-10">
                      <label class="flex items-center gap-1 px-1 py-1 text-gray-700 cursor-pointer hover:bg-gray-100">
                        <input type="radio" name="stopover" class="hidden" value="Non-stop only" checked>
                        <span>Non-stop only</span>
                      </label>
                      <label class="flex items-center gap-1 px-1 py-1 text-gray-700 cursor-pointer hover:bg-gray-100">
                        <input type="radio" name="stopover" class="hidden" value="One stop or fewer">
                        <span>One stop or fewer</span>
                      </label>
                      <label class="flex items-center gap-1 px-1 py-1 text-gray-700 cursor-pointer hover:bg-gray-100">
                        <input type="radio" name="stopover" class="hidden" value="One stop or fewer (overnight)">
                        <span>One stop or fewer (overnight)</span>
                      </label>
                      <label class="flex items-center gap-1 px-1 py-1 text-gray-700 cursor-pointer hover:bg-gray-100">
                        <input type="radio" name="stopover" class="hidden" value="Two stops or fewer (overnight)">
                        <span>Two stops or fewer (overnight)</span>
                      </label>
                    </div>
                  </div>
                  <!-- Options button -->
                  <button id="toggle-options" class="flex items-center gap-1 px-1 py-2 bg-[#20006D] text-white font-medium rounded-lg active:bg-[#5A005D] hover:bg-[#1A005D] transition cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5 inline-block align-middle">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0h9.75" />
                    </svg>
                    OPTIONS
                  </button>
                </div>
              </div>
                  <div id="donation-reminder" class="hidden absolute top-1/3 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white border border-gray-300 rounded-lg shadow-xl p-4 max-w-xs z-50 w-80">
                    <div class="flex justify-between items-start mb-2">
                      <h3 class="font-bold text-lg text-gray-800">Enjoy this tool?</h3>
                      <button id="close-reminder" class="text-gray-500 hover:text-gray-700 cursor-pointer transition">
                        ✕
                      </button>
                    </div>
                    <p class="text-gray-600 mb-3">Help me keep it updated and improved. Your support matters!</p>
                    <div class="flex flex-col gap-2">
                      <a id="donate-link-reminder" href="https://buy.stripe.com/4gM00j9fA6Hua291mWbo400" target="_blank"
                        rel="noopener noreferrer" class="donate-link bg-[#C90076] hover:bg-[#A00065] text-white font-bold py-2 px-4 rounded text-center transition">
                         ☕ Support with donation
                      </a>
                      <button id="leave-review" 
                              class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded cursor-pointer transition">
                        ⭐ Rate on Chrome Web Store
                      </button>
                    </div>
                  </div>
              <!-- Options Container -->
              <div class="mb-0">
                <div id="options-container" class="mt-2 p-2 rounded-md border-2 border-[#20006D] hidden">
                  <fieldset class="theme-setting mb-2 flex items-center justify-between gap-2 border-b pb-2">
                    <legend class="sr-only">Appearance</legend>
                    <span class="theme-text text-sm font-medium">Appearance</span>
                    <div class="theme-mode-switch" role="radiogroup" aria-label="Color theme">
                      <label class="theme-mode-option">
                        <input type="radio" name="theme-mode" value="auto">
                        <span>Auto</span>
                      </label>
                      <label class="theme-mode-option">
                        <input type="radio" name="theme-mode" value="light">
                        <span>Light</span>
                      </label>
                      <label class="theme-mode-option">
                        <input type="radio" name="theme-mode" value="dark">
                        <span>Dark</span>
                      </label>
                    </div>
                  </fieldset>
                  <div class="flex items-center justify-between flex-nowrap pb-2 gap-1">
                
                    <!-- Connection Time -->
                    <div class="flex flex-col items-center border-2 border-gray-300 rounded-md px-1 py-2 shrink-0">
                      <label class="text-gray-700 text-xsfont-medium mb-1">Connection time</label>
                      <div class="flex items-center gap-1">
                        <div class="flex flex-col items-center">
                          <span class="text-xs font-medium mb-1">MIN (m)</span>
                          <input type="number" id="min-connection-time" value="90"
                                 class="bg-gray-100 border border-gray-300 rounded px-1 py-1 w-[55px] text-right focus:ring-[#C90076]">
                        </div>
                        <div class="flex flex-col items-center">
                          <span class="text-xs font-medium mb-1">MAX (m)</span>
                          <input type="number" id="max-connection-time" value="1440"
                                 class="bg-gray-100 border border-gray-300 rounded px-1 py-1 w-[55px] text-right focus:ring-[#C90076]">
                        </div>
                      </div>
                    </div>
                
                    <!-- Preferred Airport -->
                    <div class="w-full">
                    <div class="relative flex-shrink min-w-0 basis-20 mb-2">
                      <label class="block text-gray-700 font-xs mb-1">Preferred Airport</label>
                      <input type="text" id="preferred-airport"
                             class="w-full bg-gray-100 border border-gray-300 rounded px-1 py-1 focus:ring-[#C90076]"
                             placeholder="Enter preferred airport">
                      <div id="airport-suggestions-preferred"
                           class="absolute top-full left-0 right-0 bg-white border border-gray-300 rounded-md shadow-lg hidden"></div>
                    </div>

                    <!-- Clear Cache -->
                    <button id="clear-cache-button"
                            class="w-full relative flex-shrink py-1.5 min-w-0 basis-20 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 focus:ring-[#C90076] cursor-pointer">
                      CLEAR CACHE
                    </button>
                  </div>
                  </div>
                  <!-- Allow changing connection airport -->
                  <div class="flex items-center gap-2 mb-2">
                    <label class="inline-flex items-center gap-1 text-gray-700">
                      <input type="checkbox" id="allow-change-airport" class="h-4 w-4">
                      <span class="text-xs font-medium">Allow changing connecting airport (one-stop routes only)</span>
                    </label>
                      <div id="connection-radius-container" class="relative inline-block hidden">
                      <input
                        type="number"
                        id="connection-radius"
                        class="w-20 pr-5 bg-white border border-gray-300 rounded-lg px-2 py-1 text-right
                              placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#C90076]
                              focus:border-transparent transition"
                        placeholder="Radius"
                        min="0"
                      />
                      <span class="absolute inset-y-0 right-2 flex items-center text-gray-500 select-none">
                        km
                      </span>
                    </div>
                  </div>
                  <!-- Custom Airport Groups -->
                  <div class="mb-2 border-t pt-2">
                    <div class="flex justify-between items-center mb-1">
                      <span class="text-gray-700 font-medium text-sm">Custom Airport Groups</span>
                      <button id="toggle-custom-groups" class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded hover:bg-gray-300 cursor-pointer">
                        MANAGE
                      </button>
                    </div>
                    <div id="custom-groups-panel" class="hidden">
                      <div id="custom-groups-list" class="mb-2"></div>
                      <div class="border border-gray-300 rounded-md p-2 bg-white">
                        <div class="text-xs font-semibold text-gray-700 mb-1">Add New Group</div>
                        <div class="flex flex-col gap-1">
                          <input type="text" id="custom-group-name" placeholder="Name (e.g. Home Airports)"
                                 class="bg-gray-100 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-[#C90076]">
                          <input type="text" id="custom-group-key" placeholder="Tag: 2–6 chars (e.g. HOME)"
                                 maxlength="6"
                                 class="bg-gray-100 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-[#C90076] uppercase">
                          <input type="text" id="custom-group-airports" placeholder="Airport codes, comma-separated (e.g. PSA, BLQ, PEG)"
                                 class="bg-gray-100 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-[#C90076]">
                          <button id="add-custom-group-btn"
                                  class="w-full bg-[#C90076] text-white px-2 py-1 rounded hover:bg-[#A00065] active:bg-[#A00050] cursor-pointer text-sm font-semibold transition">
                            + Add Group
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Expert Settings -->
                  <button id="toggle-expert-settings" class="w-full bg-gray-200 text-gray-700 px-1 py-2 mb-2 rounded hover:bg-gray-300 focus:outline-none focus:ring-gray-400 cursor-pointer">
                    SHOW EXPERT SETTINGS
                  </button>
                  <div id="expert-settings" class="mt-1 mb-1 hidden border-t pt-1">
                    <div class="grid grid-cols-2 gap-1">
                      <div>
                        <label class="block text-gray-700 font-medium mb-1">Requests per Batch:</label>
                        <input type="number" id="max-requests" value="50" min="1"
                          class="w-full bg-gray-100 border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-[#C90076]">
                      </div>
                      <div>
                        <label class="block text-gray-700 font-medium mb-1">Max Concurrent Requests:</label>
                        <input type="number" id="max-concurrent-requests" value="3" min="1"
                          class="w-full bg-gray-100 border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-[#C90076]">
                        <p id="max-concurrent-requests-error" class="hidden mt-1 text-xs text-red-600">
                          Choose at least 1 simultaneous request.
                        </p>
                      </div>
                      <div>
                        <label class="block text-gray-700 font-medium mb-1">Batch Pause (sec):</label>
                        <input type="number" id="pause-duration" value="15" min="0"
                          class="w-full bg-gray-100 border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-[#C90076]">
                      </div>
                      <div>
                        <label class="block text-gray-700 font-medium mb-1">Cache Lifetime (hrs):</label>
                        <input type="number" id="cache-lifetime" value="4"
                          class="w-full bg-gray-100 border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-[#C90076]">
                      </div>
                    </div>
                     <div class="mt-2">
                      <button id="toggle-debug" class="w-full bg-gray-200 text-gray-700 px-1 py-2 mb-1 rounded hover:bg-gray-300 focus:outline-none focus:ring-1 focus:ring-gray-400 cursor-pointer">
                        DEBUG MODE: OFF
                      </button>
                      <div id="debug-log-container" class="hidden mt-1">
                        <label class="block text-gray-700 font-medium mb-1">Debug Log:</label>
                        <textarea id="debug-log" class="w-full h-32 bg-gray-100 border border-gray-300 rounded px-2 py-1 text-xs font-mono" readonly></textarea>
                        <div class="flex gap-1 mt-1">
                          <button id="download-debug-log" class="flex-1 bg-gray-200 text-gray-700 px-1 py-1 rounded hover:bg-gray-300">Download Log</button>
                          <button id="clear-debug-log" class="flex-1 bg-gray-200 text-gray-700 px-1 py-1 rounded hover:bg-gray-300">Clear Log</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="w-full lg:w-1/2 lg:pl-5">
          <div id="results-container" class="relative bg-gray-100 rounded-lg shadow-md py-2 px-2 hidden">  
            <div id="results-and-sort-container" class="results-toolbar flex flex-wrap justify-between items-center gap-2 mb-4 hidden">
              <p id="total-results" class="text-lg font-semibold text-[#20006D] mb-0 shrink-0">Total results: 0</p>
              <div class="results-toolbar-controls flex flex-wrap items-center justify-end gap-2 min-w-0 ml-auto">
                <button id="download-csv-button" class="flex justify-between p-1 items-center bg-[#20006D] gap-1 text-white rounded-lg hover:bg-[#1A005D] focus:ring-2 focus:ring-[#C90076] cursor-pointer hidden shrink-0">
                  &#x2B07; CSV
                </button>
                <div class="results-sort-field flex items-center gap-1 min-w-0">
                  <label id="sort-select-label" for="sort-select" class="text-sm font-medium text-gray-700 whitespace-nowrap">Sort by</label>
                  <select id="sort-select" class="block w-full sm:w-auto min-w-0 bg-gray-100 border border-gray-300 text-gray-800 rounded-md px-2 py-1 focus:outline-none focus:ring-2 focus:ring-[#C90076] cursor-pointer">
                    <option value="default" selected>Search order</option>
                    <option value="airport">Departure airport</option>
                    <option value="arrivalAirport">Arrival airport</option>
                    <option value="departure">Departure date/time</option>
                    <option value="arrival">Arrival date/time</option>
                    <option value="duration">Total journey duration</option>
                    <option value="transfers">Fewest transfers</option>
                    <option value="connections">Least connection time</option>
                  </select>
                </div>
                <div id="return-sort-controls" class="results-sort-field hidden items-center gap-1 min-w-0">
                  <label for="return-sort-select" class="text-sm font-medium text-gray-700 whitespace-nowrap">Return options</label>
                  <select id="return-sort-select" class="block w-full sm:w-auto min-w-0 bg-gray-100 border border-gray-300 text-gray-800 rounded-md px-2 py-1 focus:outline-none focus:ring-2 focus:ring-[#C90076] cursor-pointer">
                    <option value="departure" selected>Earliest departure</option>
                    <option value="arrival">Earliest arrival</option>
                    <option value="duration">Shortest journey</option>
                  </select>
                </div>
                <div class="results-sort-field flex items-center gap-1 min-w-0">
                  <label for="sort-direction-select" class="text-sm font-medium text-gray-700 whitespace-nowrap">Order</label>
                  <select id="sort-direction-select" aria-label="Sort direction" class="block w-full sm:w-auto min-w-0 bg-gray-100 border border-gray-300 text-gray-800 rounded-md px-2 py-1 focus:outline-none focus:ring-2 focus:ring-[#C90076] cursor-pointer">
                    <option value="asc" selected>Ascending</option>
                    <option value="desc">Descending</option>
                  </select>
                </div>
              </div>
            </div>
            <div id="progress-container" class="bg-[#F5F5F5] text-[#20006D] rounded p-4 mb-4 hidden">
              <p id="progress-text" class="mb-2 font-medium"></p>
              <div class="w-full bg-gray-300 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-[#20006D] h-2" style="width: 0%;"></div>
              </div>
            </div>
            <div id="timeout-status" class="bg-[#F5F5F5] text-[#20006D] rounded p-4 mb-4 hidden"></div>
            <div class="route-list"></div>
          </div>
          <div id="notification-banner" class="hidden opacity-0 bg-[#20006D] text-white fixed bottom-5 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded shadow-lg transition-opacity duration-500">

        </div>
      </div>
    </div>
  </section>
</body>
